    <!-- Structured data — reflects only information visible on the page -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Pulse",
            "url": "%VITE_SITE_URL%/",
            "logo": {
              "@type": "ImageObject",
              "url": "%VITE_SITE_URL%/og-image.png",

              "height": 630
            }
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Pulse",
            "inLanguage": "en",

            "@type": "SoftwareApplication",
            "@id": "%VITE_SITE_URL%/#software",

            "description": "AI-powered social media automation: draft once, then schedule and publish to Instagram, TikTok, X, LinkedIn, YouTube, Facebook and Threads with AI captions and best-time-to-post prediction.",

              "@type": "AggregateOffer",
              "priceCurrency": "USD",
              "lowPrice": "19",
              "highPrice": "99",
              "offerCount": 3,
              "availability": "https://schema.org/InStock",
              "url": "%VITE_SITE_URL%/#pricing"
            }
